<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#d97706">
    <title>Nivora Restaurant Offline</title>
    <style>
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#f9fafb;font-family:system-ui,sans-serif}
        main{width:min(440px,calc(100% - 32px));border:1px solid #374151;border-radius:8px;padding:28px;background:#1f2937}
        h1{font-size:22px;margin:0 0 10px}p{color:#d1d5db;line-height:1.5;margin:0 0 20px}
        button{border:0;border-radius:6px;padding:11px 16px;background:#d97706;color:#fff;font-weight:700;cursor:pointer}
    </style>
</head>
<body>
<main>
    <h1>Nivora Restaurant está offline</h1>
    <p>A ligação ao servidor não está disponível. As operações já guardadas neste dispositivo serão sincronizadas quando a conexão voltar.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
